<?xml version="1.0" encoding="UTF-8"?>
<!-- QEMU ISO Lab: an optical disc behind a terminal window. The application-menu icon
     (setup.sh installs it as hicolor/scalable/apps/qemu-iso-lab.svg), the dashboard's and
     the catalog site's favicon. Shapes only, no text: it must read at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2d44"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- the disc -->
  <g transform="translate(160 96)">
    <circle r="66" fill="url(#disc)"/>
    <circle r="66" fill="url(#shine)"/>
    <circle r="40" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <circle r="19" fill="#0b1424"/>
    <circle r="8" fill="#e0f2fe"/>
    <path d="M-62 -14 A64 64 0 0 1 -18 -62" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- the terminal window -->
  <g>
    <rect x="30" y="104" width="150" height="116" rx="14" fill="#0b1220" stroke="#cbd5e1" stroke-width="4"/>
    <path d="M30 130 H180" stroke="#cbd5e1" stroke-width="3"/>
    <circle cx="48" cy="117" r="5" fill="#f87171"/>
    <circle cx="66" cy="117" r="5" fill="#fbbf24"/>
    <circle cx="84" cy="117" r="5" fill="#4ade80"/>
    <!-- the prompt: > and a cursor -->
    <path d="M54 152 L82 172 L54 192" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="96" y="184" width="40" height="12" rx="4" fill="#4ade80"/>
  </g>
</svg>
