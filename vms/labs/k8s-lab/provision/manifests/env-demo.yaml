# k8s-lab, exercise 5: a pod that reads web-config and web-secret as environment and as files.
apiVersion: v1
kind: Pod
metadata:
  name: env-demo
spec:
  containers:
  - name: show
    image: busybox:1.36
    command: ["sh", "-c", "echo GREETING=$GREETING COLOR=$COLOR PASSWORD=$PASSWORD; sleep 3600"]
    envFrom:
    - configMapRef: {name: web-config}
    - secretRef: {name: web-secret}
    volumeMounts:
    - {name: config, mountPath: /config}
  volumes:
  - name: config
    configMap: {name: web-config}
