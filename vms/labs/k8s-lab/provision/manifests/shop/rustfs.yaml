# The Kubernetes course, RustFS: an S3 object store (MinIO-compatible; MinIO stopped publishing
# public images in 2025). The keys come from the Secret s3-credentials, the data sit on a claim,
# the S3 API is the Service "rustfs" on 9000 and the web console NodePort 30081 (host 8090).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: rustfs}
  template:
    metadata:
      labels: {app: rustfs}
    spec:
      # On the control plane, always: a hostpath volume is a directory on one node's disk, so the
      # pod could not follow a drain elsewhere anyway (it would wait Pending for its node).
      nodeSelector: {kubernetes.io/hostname: k8s-lab-main}
      securityContext: {fsGroup: 10001}
      initContainers:
      # hostpath volumes ignore fsGroup: the image runs as uid 10001 and needs to own /data.
      - name: chown
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 10001:10001 /data"]
        volumeMounts:
        - {name: data, mountPath: /data}
      containers:
      - name: rustfs
        image: rustfs/rustfs:1.0.1
        env:
        - name: RUSTFS_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key}}
        - name: RUSTFS_SECRET_KEY
          valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-key}}
        ports:
        - {containerPort: 9000, name: s3}
        - {containerPort: 9001, name: console}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {memory: 512Mi}
        volumeMounts:
        - {name: data, mountPath: /data}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: rustfs-data}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
spec:
  selector: {app: rustfs}
  ports:
  - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
spec:
  type: NodePort
  selector: {app: rustfs}
  ports:
  - {name: console, port: 9001, targetPort: console, nodePort: 30081}
