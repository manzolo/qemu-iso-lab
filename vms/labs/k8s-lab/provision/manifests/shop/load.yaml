# The Kubernetes course, load for the autoscaler: two pods asking the app's /work (a few hundred
# milliseconds of CPU) without pause, through the Service, so every replica gets its share.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  replicas: 2
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      containers:
      - name: load
        image: busybox:1.36
        command: ["sh", "-c", "while true; do wget -q -O /dev/null http://shop/work; done"]
        resources:
          requests: {cpu: 10m, memory: 8Mi}
