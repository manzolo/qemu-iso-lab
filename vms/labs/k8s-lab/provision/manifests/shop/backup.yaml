# The Kubernetes course, a CronJob: every two minutes an init container asks Redis for a snapshot
# (redis-cli --rdb) and the job copies it into the bucket "backups" on RustFS (backup.py).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          initContainers:
          - name: snapshot
            image: redis:7-alpine
            command: ["redis-cli", "-h", "redis", "--rdb", "/backup/dump.rdb"]
            volumeMounts:
            - {name: backup, mountPath: /backup}
          containers:
          - name: upload
            image: python:3.12-alpine
            command: ["python", "-u", "/app/backup.py"]
            env:
            - {name: S3_ENDPOINT, value: "rustfs:9000"}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-key}}
            volumeMounts:
            - {name: backup, mountPath: /backup}
            - {name: code, mountPath: /app}
          volumes:
          - name: backup
            emptyDir: {}
          - name: code
            configMap: {name: shop-code}
