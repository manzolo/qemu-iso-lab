name: ISO links

# Are the catalog's ISO download links still alive? tools/check_iso_urls.py sends one ranged GET per
# URL (nothing is downloaded) and fails when a profile has no working source left: vendors move and
# rename their media (Kali 2026.1, the KDE neon "user" images, CentOS Stream composes, FreeBSD 14.3
# moving to the archive, all in one week of 2026-09/10). Weekly, so a dead link shows up before a
# night matrix finds it; the run's summary lists every bad source.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the ISO links
        run: python3 tools/check_iso_urls.py --summary "$GITHUB_STEP_SUMMARY"
